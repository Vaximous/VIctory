# Copy to `victory.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# VICTORY_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: VICTORY_GAME_DIR
game_dir = 'D:\victory-data\game'

# Derived data. Default: %LOCALAPPDATA%\victory\cache.   env: VICTORY_CACHE_DIR
# cache_dir = 'D:\victory-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\victory\data.   env: VICTORY_DATA_DIR
# data_dir = 'D:\victory-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: VICTORY_TEST_TITLES (separated by ';')
test_titles = []

[graphics]
# What brings the picture from render size to the screen.   env: VICTORY_UPSCALER
#   "fsr4"  the title's own ML upscaler (default; about two thirds of the card's time here)
#   "none"  a plain bilinear upscale, no anti-aliasing (fastest)
#   "fxaa"  FXAA at render size, then bilinear
# The render size is the title's either way.
# upscaler = "none"

# false: the title's ray-tracing passes do not run.   env: VICTORY_RAY_TRACING (on/off)
# ray_tracing = false

[input]
# Raw mouse input (no acceleration): the camera, and buttons on the pad.   env: VICTORY_MOUSE (1/0)
# While on and the window has focus the cursor is hidden and kept in the
# window; release_key (default F8) frees it, a click into the window or the
# key again takes it back; leaving the window (Alt+Tab) frees it too.
# WASD and the other keys stay the stand-in pad's (docs/README-fxceless.md).
# mouse = true
# Camera file (outside this folder): where the title keeps each camera's yaw
# and pitch, as pointer chains from the title image's base. Movement then turns
# those directly (a fixed angle per count, no stick curve); where none is found
# it moves the right stick instead.   env: VICTORY_MOUSE_CAMERA
#   [[camera]]
#   name = "on foot"
#   yaw = [0x1234, 0x10]        # image base + 0x1234 -> pointer, + 0x10
#   pitch = [0x1234, 0x14]
#   yaw_per_count = -0.0006     # radians per count at sensitivity 1; sign = direction
#   pitch_per_count = -0.0006
#   pitch_min = -1.4            # defaults; wrap = 6.2831853 (radians), 360 for degrees, 0 none
#   pitch_max = 1.4
# camera = 'D:ictory-data\mouse-camera.toml'
# Stick movement:
# speed * sensitivity / 2000 counts/s is a full stick.   env: VICTORY_MOUSE_SENS
# sensitivity = 1.0
# Exponent on that speed: 1 linear, above 1 finer slow aim.   env: VICTORY_MOUSE_CURVE
# curve = 1.0
# Smallest stick a moving mouse gives, past the title's dead zone.   env: VICTORY_MOUSE_BOOST
# deadzone_boost = 0.15
# Largest stick (0 to 1).
# cap = 1.0
# env: VICTORY_MOUSE_INVERT_Y (on/off)
# invert_y = false
# Shortest press of a click or wheel notch, so a frame sees it (ms).
# hold_ms = 100
# release_key = "F8"
# Pad buttons: a b x y up down left right (D-pad) lb rb ls rs menu view lt rt none.
# left_button = "rt"       # fire
# right_button = "lt"      # aim
# middle_button = "rs"
# back_button = "lb"       # side button (X1): weapon wheel
# forward_button = "rb"    # side button (X2)
# wheel_up = "right"       # D-pad right / left: next / previous weapon
# wheel_down = "left"
